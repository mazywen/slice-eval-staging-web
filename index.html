<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="slice-api-origin" content="https://api-staging.slice.wang">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Slice 中台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./native/console.css?v=441cfa50c7c6">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="https://creator-staging.slice.wang/create" aria-label="回到创作工作台">
      <svg width="18" height="18" viewBox="0 0 76 65" aria-hidden="true"><path d="M37.6 0 75.2 65H0z" fill="currentColor"/></svg>Slice</a>
    <span class="slash">/</span>
    <div class="crumb">
      <select id="world" aria-label="作品"><option value="">选择作品</option></select>
      <span class="slash hide-sm">/</span>
      <select id="version" class="hide-sm" aria-label="版本"><option value="draft">草稿</option></select>
    </div>
    <div class="spacer"></div>
    <span class="proto">内部试玩</span>
    <button class="btn ghost sm" id="open-prices">单价</button>
    <button class="btn ghost sm" id="theme" aria-label="切换深浅色">◐</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-view="play" aria-selected="true">逐步试玩</button>
    <button class="tab" role="tab" data-view="timeline">这一局的时间线</button>
    <button class="tab" role="tab" data-view="flow">流程与成本</button>
    <button class="tab" role="tab" data-view="prompts">提示词</button>
  </nav>
</header>
<main id="main"></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header><div><h2 id="dr-title"></h2><p id="dr-sub"></p></div><button class="btn ghost sm" id="dr-close" aria-label="关闭">✕</button></header>
  <div class="body" id="dr-body"></div>
</aside>

<script type="module" src="./native/console.mjs?v=441cfa50c7c6"></script>
</body>
</html>
